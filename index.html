<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品上架表体检器</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">CSV Listing Guard</p>
          <h1>商品上架表体检器</h1>
        </div>
        <div class="status-pill" id="fileName">未选择文件</div>
      </header>

      <section class="workspace">
        <aside class="panel upload-panel">
          <h2>导入商品表</h2>
          <p class="muted">仅在浏览器本地解析 CSV 或粘贴内容，不上传、不登录平台、不自动上架。</p>

          <label class="drop-zone" for="csvFile">
            <span>选择 CSV 文件</span>
            <small>支持常见字段：标题、SKU、图片、价格、库存、描述、SEO 标题/描述</small>
          </label>
          <input id="csvFile" type="file" accept=".csv,text/csv">

          <div class="paste-box">
            <label for="pasteData">从 Excel / 表格复制粘贴</label>
            <textarea id="pasteData" rows="7" placeholder="把表头和商品行粘贴到这里，例如：标题、SKU、图片、价格、库存..."></textarea>
            <button id="analyzePaste" type="button">分析粘贴内容</button>
          </div>

          <div class="button-row">
            <button id="loadSample" type="button">载入示例</button>
            <button id="resetTool" type="button" class="secondary">清空</button>
          </div>

          <div class="boundary">
            <h3>交付边界</h3>
            <p>本工具只做格式、完整性和常见风险提示，不替代平台官方审核，不承诺导入成功、审核通过、排名或成交。</p>
          </div>

          <a class="learn-link" href="./article-7-mistakes.html">阅读：商品表导入前 7 个坑</a>
        </aside>

        <section class="content">
          <div class="panel">
            <div class="panel-head">
              <div>
                <h2>体检结果</h2>
                <p id="statusText" class="muted">上传 CSV 或粘贴表格后开始体检。</p>
              </div>
              <div class="result-actions">
                <button id="copyRequest" type="button" class="secondary" disabled>复制诊断需求</button>
                <button id="downloadReport" type="button" disabled>下载报告</button>
              </div>
            </div>

            <div id="summary" class="summary-grid"></div>
            <div id="fields" class="field-list"></div>

            <div id="requestBox" class="request-box" hidden>
              <h3>人工诊断需求说明</h3>
              <textarea id="requestText" rows="8" readonly></textarea>
              <small>可复制这段说明，并附上脱敏后的商品表，用于咨询 99 元人工诊断。</small>
            </div>

            <div class="filters" aria-label="问题筛选">
              <button class="active" type="button" data-filter="all">全部</button>
              <button type="button" data-filter="critical">严重</button>
              <button type="button" data-filter="warning">提醒</button>
              <button type="button" data-filter="info">建议</button>
            </div>

            <div id="emptyState" class="empty-state">
              <strong>还没有体检报告</strong>
              <span>先上传 CSV、粘贴表格，或者载入示例数据看看效果。</span>
            </div>

            <div id="issues" class="issue-table"></div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
